n datos reales.", "Prueba una campaña hacia catálogo o DM; pide uso, medidas y zona antes de cotizar. Si no hay ecommerce, usa un proceso de venta asistida explícito.", "Ejemplo USD 150: 40 catálogo + 80 difusión + 30 operación. No prometas instalación o entrega no confirmadas."]], "hooks": ["Que el apuro de diciembre no decida tus acabados.", "Tres errores antes de comprar un revestimiento.", "Una foto bonita no confirma que un material sea adecuado para tu proyecto.", "Qué necesito para cotizarte sin hacerte perder tiempo.", "Ahora atendemos online: así eliges, cotizas y recibes tu pedido.", "Tu recomendación tiene un código y condiciones claras."], "pieces": [["Reel educativo · 30 segundos", "¿Quieres preparar una remodelación antes de diciembre? Antes de elegir por una foto, revisemos uso, medidas y disponibilidad. En Dztwister atendemos online y te explicamos cómo cotizar revestimientos, sanitarios y griferías según el alcance del proyecto. Escríbenos ACABADOS con tu zona y lo que necesitas. Te compartimos el catálogo y confirmamos opciones y entrega antes de comprar.", "Muestra producto y criterio técnico; Halloween puede quedar fuera del titular."], ["Mensaje para referidor", "Hola, [nombre]. Estamos organizando compras y proyectos para cierre de año. ¿Te puedo compartir el catálogo actualizado? Si conoces a alguien que necesite [categoría disponible], puedes usar el código [código]. El beneficio y sus condiciones son [detalle validado]. Se reconoce después de una compra confirmada.", "Es un borrador uno a uno para relaciones existentes; completa condiciones antes de usar."]], "live": "Live con instalador: cinco datos antes de comprar acabados. Explica uso, medidas, compatibilidad, disponibilidad y entrega. No improvises una ficha técnica ni equivalencias no verificadas.", "asset": "Catálogo o ficha digital por solución: foto real, medidas, uso, disponibilidad, precio/forma de cotización, entrega y contacto. Si no existe tienda online, comunica “solicita coti function renderEnfoque(p){
 const evidence=p.evidence.map(k=>{const e=DATA.evidence[k];return '<article class="evidence"><span class="status">ANTECEDENTE VENEZOLANO · NO RESULTADO GARANTIZADO</span><h3>'+escapeHTML(e.title)+'</h3>'+textP(e.fact)+textP(e.result,'subtle')+textP(e.lesson)+linkSource(e.src)+'</article>';}).join('');
 return panel('Qué se observó en Venezuela','<p>Estos casos muestran mecanismos pertinentes. Cuando solo hay anuncios o testimonios, no se afirma que aumentaron las ventas.</p>'+evidence,'01 / EVIDENCIA')+panel('Tu punto de partida',textP(p.intro,'lead')+textP(p.known,'subtle')+'<h3>Antes de publicar, confirma</h3>'+list(p.checks),'02 / ENCAJE')+panel('Cómo diferenciarte',textP(p.personal)+(p.certificate?certBlock():'')+((p.kind.includes('Fitness'))?'<p class="subtle">Criterio de entrenamiento: objetivos, experiencia, recuperación, disponibilidad y seguridad guían la adaptación. No entrenar a diario no equivale a fracaso; la antropometría tampoco es un requisito universal para empezar.</p>'+linkSource('T03'):'')+(p.id==='luis-carlos'?'<p class="subtle">El yoga puede apoyar aspectos del bienestar. Esta evidencia general no permite prometer resultados específicos de Kundalini.</p>'+linkSource('T04'):''),'03 / POSICIONAMIENTO');
}
function getBudget(p){const n=Number(getStore('smfit-budget-'+p.id,0));return n>=0&&n<=2?n:0;}
function renderPlan(p){const n=getBudget(p),b=p.budgets[n];return panel('La estrategia que vas a ejecutar',textP(p.strategy,'lead')+'<h3>Oferta o invitación</h3>'+textP(p.offer)+'<div class="callout"><h4>Condiciones que debes dejar claras</h4>'+textP(p.offerconditions)+'</div>','04 / DECISIÓN')+panel('Elige tu escenario de presupuesto','<p>Estos montos son <strong>techos orientativos de planeación en USD</strong>, no cotizaciones de mercado. Incluyen el esfuerzo de campaña descrito; el tiempo profesional, herramientas ya contratadas, operación del servicio y beneficios comerciales se calculan por separado cuando corresponda.</p><div class="budget-options" role="group" aria-label="Escenarios de presupuesto">'+p.budgets.map((x,i)=>'<button class="budget-choice '+(i===n?'selected':'')+'" data-budget="'+i+'" aria-pressed="'+(i===n)+'"><span>'+escapeHTML(x[0])+'</span><strong>'+escapeHTML(x[1])+'</strong><span>'+(i===0?'Comienza aquí si no tienes presupuesto definido':'Opción adicional')+'</span></button>').join('')+'</div><div id="budget-detail"><p class="label">Escenario seleccionado</p><h3>'+escapeHTML(b[0])+' · '+escapeHTML(b[1])+'</h3><div class="step"><span class="step-number">1</span><div><h4>Preparar</h4>'+textP(b[2])+'</div></div><div class="step"><span class="step-number">2</span><div><h4>Ejecutar</h4>'+textP(b[3])+'</div></div><div class="step"><span class="step-number">3</span><div><h4>Distribuir recursos</h4>'+textP(b[4])+'</div></div></div><p class="subtle">En una ventana corta, no necesitas hacer las tres opciones. Si no hay oferta, respuesta y medición listas, prioriza contenido y red propia antes de comprar alcance.</p>','05 / RECURSOS')+panel('Una alianza que sí tiene sentido',textP(p.alliance)+'<p class="subtle">Define aportes, responsable de atender, condiciones y código de origen. La colaboración no se da por confirmada hasta acordarla con el aliado.</p>','06 / COLABORACIÓN')+(p.calculator?calculator(p):'');}
function renderContenido(p){return panel('Hooks para tu contexto','<p>Escoge uno según la pieza. Los hooks de problema explican un riesgo concreto; los positivos muestran proceso, claridad o una posibilidad real.</p><ol class="hooklist">'+p.hooks.map(x=>'<li>'+escapeHTML(x)+'</li>').join('')+'</ol>','07 / ATENCIÓN')+panel('Textos para adaptar y publicar','<p>Completa datos, enlaces y condiciones antes de usar. No publiques campos entre corchetes ni atribuyas resultados a clientes sin autorización.</p>'+p.pieces.map((x,i)=>draft(x[1],p.id+'-piece-'+i,x[0],x[2])).join(''),'08 / PRODUCCIÓN')+panel('Una conversación en vivo',textP(p.live)+'<h3>Un solo CTA al cerrar</h3><p>Invita a revisar la ficha o modalidad y escribir <strong>'+escapeHTML(p.keyword)+'</strong>. No ofrezcas consulta, sorteo, compra y seguimiento distintos en la misma llamada final.</p>','09 / LIVE');}
function renderCaptacion(p){return panel('Que la persona entienda antes de cotizar',textP(p.asset,'lead')+'<ol class="flow"><li><strong>Contenido específico.</strong> Explica una necesidad, muestra tu trabajo e indica para quién es.</li><li><strong>Ficha, destacado o página.</strong> Resuelve modalidad, inclusiones y condiciones. Si tu cuenta ya lo explica bien, el DM puede ser el primer paso.</li><li><strong>DM con propósito.</strong> Formula pocas preguntas para comprobar encaje.</li><li><strong>Propuesta y coordinación.</strong> Envía precio y alcance. Pasa a WhatsApp con permiso si facilita la reserva o el seguimiento.</li><li><strong>Confirmación.</strong> Registra reserva, pago o compra efectiva, no solo el mensaje recibido.</li></ol><p class="subtle">No es obligatorio imponer siempre una landing o evitar WhatsApp. La decisión depende de complejidad, ticket, capacidad de respuesta y claridad previa. En esta propuesta se prioriza cualificar para reducir conversaciones sin encaje.</p>','10 / RECORRIDO')+panel('Preguntas de cualificación',list(p.questions)+'<p class="subtle">Usa solo las preguntas que correspondan a cada persona. Los datos clínicos, financieros o identificables se tratan por un proceso adecuado; no se piden en comentarios públicos.</p>','11 / CONVERSACIÓN')+panel('Mensajes listos para adaptar',draft(p.dm,p.id+'-dm','Respuesta inicial','Personaliza el enlace y responde según lo que ya dijo la persona.')+draft(p.follow,p.id+'-follow','Un seguimiento útil','Úsalo si la persona mostró interés y aceptó el contacto. Si dice que no, detén el seguimiento.'),'12 / SEGUIMIENTO')+panel('Qué vas a medir',list(p.kpis)+'<p><strong>Registro mínimo:</strong> fecha, canal/código de origen, necesidad, encaje, siguiente paso, cotización, compra o reserva pagada y costo asociado.</p><p class="subtle">No se fijan metas de venta inventadas. Define una meta acorde a capacidad real y revisa qué ocurrió al cierre.</p>','13 / RESULTADO');}
const dates=[['21–23 OCT','Preparación'],['24–25 OCT','Primera difusión'],['26–28 OCT','Conversación'],['29–30 OCT','Activación'],['31 OCT','Sábado · Halloween'],['1 NOV','Domingo · cierre']];
function renderAgenda(p){const done=getStore('smfit-tasks-'+p.id,[]),count=done.filter(Boolean).length;return panel('Tu calendario hasta el domingo 1 de noviembre','<p>La oferta comercial de esta propuesta termina el <strong>1 de noviembre de 2026</strong>. El servicio o evento contratado puede realizarse después si se informa claramente; por ejemplo, una reserva para diciembre.</p><div class="calendar">'+dates.map((d,i)=>'<article class="day"><div class="date">'+d[0]+'<span>'+d[1]+'</span></div>'+textP(p.calendar[i])+'</article>').join('')+'</div>','14 / FECHAS')+panel('Tu lista de ejecución','<div class="progress"><span id="progress-label">'+count+' de 6 tareas completadas</span><progress id="progress" value="'+count+'" max="6">'+count+'/6</progress></div><ul class="checklist">'+p.calendar.map((x,i)=>'<li><label><input type="checkbox" data-task="'+i+'" '+(done[i]?'checked':'')+'><span>'+escapeHTML(x)+'</span></label></li>').join('')+'</ul><p class="privacy">El avance se guarda solo en este navegador si permite almacenamiento local. No se sincroniza con Asana, Calendar ni con otros participantes.</p>','15 / CONTROL')+panel('Prompt para trabajar con IA','<p>Completa primero la información de tu negocio. Pega después el prompt en la herramienta que ya utilizas; la IA propone y tú validas.</p><textarea class="prompt" id="'+p.id+'-prompt" aria-label="Prompt editable para '+escapeHTML(p.name)+'">'+escapeHTML(buildPrompt(p))+'</textarea><button class="btn secondary copybtn" data-copy="'+p.id+'-prompt">Copiar prompt</button>','16 / APOYO');}
function buildPrompt(p){return 'Actúa como apoyo de marketing y ventas para '+p.name+' ('+p.role+').\n\nContexto: '+p.strategy+'\nVentana: del 21 de octubre al 1 de noviembre de 2026, Venezuela.\n\nDatos reales que completaré: ciudad, público, modalidad, precios, costos, stock o cupos, enlaces, presupuesto y material disponible. No supongas los datos que falten.\n\nTarea: '+p.ai+'\n\nEntrega: hook, desarrollo, CTA, formato, tarea de producción y un indicador del objetivo. Separa propuesta de hecho documentado. No inventes testimonios, credenciales, resultados ni urgencia. Usa un lenguaje cercano y profesional. Incluye un solo siguiente paso comercial.';}
function renderFuentes(p){const ids=Array.from(new Set(p.evidence.map(k=>DATA.evidence[k].src).concat(p.certificate?['T01','T02']:[],p.kind.includes('Fitness')?['T03']:[],p.id==='luis-carlos'?['T04']:[])));return panel('Qué es evidencia y qué es propuesta','<div class="rule-grid"><div><h3>Antecedente documentado</h3><p>Una fuente identifica una acción, una oferta o participación. El nivel de evidencia no equivale a rentabilidad demostrada.</p></div><div><h3>Adaptación para tu negocio</h3><p>La estrategia, los textos, los presupuestos y el calendario de este perfil son propuestas nuevas basadas en la información aportada.</p></div><div><h3>Datos pendientes</h3><p>Precios, disponibilidad, formación individual y capacidades se confirman con cada participante. No se inventan para completar el plan.</p></div><div><h3>Contenido responsable</h3><p>Las promesas deben ajustarse al alcance profesional, a la capacidad de entrega y a lo que se puede demostrar.</p></div></div><p class="subtle">Corte de investigación: 21 de octubre de 2026. No se incorporan resultados futuros. Las fuentes pueden cambiar; los límites de cada una se conservan debajo.</p>','17 / CRITERIO')+panel('Fuentes de este perfil',ids.map(id=>{const s=DATA.sources[id];return '<article class="source-entry"><span class="sourcebadge">'+id+' · '+escapeHTML(s.date)+'</span><h3>'+escapeHTML(s.title)+'</h3>'+textP(s.finding)+textP(s.limit,'subtle')+linkSource(id)+'</article>';}).join(''),'18 / RESPALDO')+panel('La marca personal no obliga a contar toda tu vida','<p>Muestra vivencias que ayuden a comprender tu criterio, tu práctica o tu manera de servir. Define qué es privado. La frecuencia de publicación no exige documentar cada actividad.</p><p>La experiencia personal no se convierte automáticamente en una recomendación universal. En servicios de entrenamiento y bienestar, muestra cómo adaptas y acompaña tus afirmaciones con el alcance que realmente puedes sostener.</p>','PRINCIPIO EDITORIAL');}
function calculator(p){return panel('Comprueba el beneficio antes de publicarlo','<p>Ejemplo editable por unidad o pedido. Los valores iniciales son ficticios. Introduce una base consistente y todos los costos variables que correspondan. Esta herramienta calcula <strong>contribución</strong>, no utilidad neta ni flujo de caja.</p><div class="calcgrid"><label>Precio antes del beneficio (USD)<input id="calc-price" data-calc type="number" min="0.01" step="0.01" value="100"></label><label>Costo variable del producto/servicio (USD)<input id="calc-cost" data-calc type="number" min="0" step="0.01" value="70"></label><label>Otros costos variables (USD)<input id="calc-other" data-calc type="number" min="0" step="0.01" value="10"></label><label>Descuento al comprador (%)<input id="calc-discount" data-calc type="number" min="0" max="100" step="0.1" value="0"></label><label>Beneficio al referidor o extra (USD)<input id="calc-benefit" data-calc type="number" min="0" step="0.01" value="0"></label></div><div id="calc-result" class="calcresult" aria-live="polite"></div><p class="subtle">Contribución = precio cobrado − costo variable − otros variables − beneficio. El porcentaje usa como base el precio cobrado. Aún faltan costos fijos y cualquier concepto no incluido; no es una recomendación tributaria ni contable.</p>','HERRAMIENTA / ESCENARIO');}
function calcValues(v){if(!v.every(Number.isFinite)||v[0]<=0||v.slice(1).some(x=>x<0)||v[3]>100)return null;const revenue=v[0]*(1-v[3]/100),contribution=revenue-v[1]-v[2]-v[4];return {revenue,contribution,margin:revenue>0?contribution/revenue*100:null};}
function calc(){const v=['price','cost','other','discount','benefit'].map(k=>{const raw=document.getElementById('calc-'+k).value;return raw.trim()===''?NaN:Number(raw);});const r=calcValues(v),el=document.getElementById('calc-result');if(!r){el.className='calcresult bad';el.textContent='Revisa los datos: precio mayor que cero, costos y beneficios no negativos, descuento entre 0 y 100%.';return;}el.className='calcresult'+(r.contribution<=0?' bad':'');el.innerHTML='<strong>USD '+r.contribution.toFixed(2)+' de contribución</strong><p>Precio cobrado: USD '+r.revenue.toFixed(2)+' · Contribución sobre ingreso: '+(r.margin===null?'no aplica':r.margin.toFixed(1)+'%')+'</p><p>'+(r.contribution<=0?'Con estos datos no queda contribución positiva para cubrir costos fijos. Revisa la oferta.':'Este importe todavía debe contribuir a cubrir costos fijos y otros conceptos no incluidos.')+'</p>';}
function drawProfile(p,tab){activeId=p.id;activeTab=tab;document.title='Estrategia de temporada para '+p.name+' — Social Media Fit';const renderers={enfoque:renderEnfoque,plan:renderPlan,contenido:renderContenido,captacion:renderCaptacion,agenda:renderAgenda,fuentes:renderFuentes};app.innerHTML='<a class="back" href="#inicio">← Panel de participantes</a><div class="layout"><aside class="sidebar"><p class="sidebar-label">Planes del grupo</p><nav aria-label="Participantes">'+DATA.profiles.map(x=>'<a href="#'+x.id+'/enfoque" class="'+(p.id===x.id?'current':'')+'"'+(p.id===x.id?' aria-current="page"':'')+'>'+escapeHTML(x.name)+'</a>').join('')+'</nav><div class="sidebar-note"><strong>Ventana de ejecución</strong><p>21 octubre — 1 noviembre<br>2026 · Venezuela</p><p>Una ruta concreta, acorde a tus recursos.</p></div></aside><div class="profile-main"><div class="profile-head"><div><p class="eyebrow">Estrategia personalizada de temporada</p><h1>'+escapeHTML(p.name)+'</h1><p>'+escapeHTML(p.role)+'</p><p><strong>'+escapeHTML(p.angle)+'</strong></p></div><div class="actions"><button class="btn small secondary" data-action="copy-route">Copiar ruta</button><button class="btn small secondary" data-action="print-profile">Imprimir mi plan</button></div></div><nav class="tabs" aria-label="Secciones de la estrategia">'+tabs.map(x=>'<a href="#'+p.id+'/'+x[0]+'" class="'+(x[0]===tab?'active':'')+'"'+(x[0]===tab?' aria-current="page"':'')+'>'+x[1]+'</a>').join('')+'</nav><div id="tab-content">'+renderers[tab](p)+'</div>'+footer()+'</div></div>';bindProfile(p);}
function bindProfile(p){document.querySelectorAll('[data-budget]').forEach(b=>b.addEventListener('click',()=>{putStore('smfit-budget-'+p.id,Number(b.dataset.budget));drawProfile(p,'plan');}));document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>copyElement(b.dataset.copy)));document.querySelectorAll('[data-task]').forEach(b=>b.addEventListener('change',()=>{const values=Array.from(document.querySelectorAll('[data-task]')).map(x=>x.checked);const saved=putStore('smfit-tasks-'+p.id,values);const n=values.filter(Boolean).length;document.getElementById('progress-label').textContent=n+' de 6 tareas completadas';document.getElementById('progress').value=n;if(!saved)toast('Avance disponible en esta sesión; el navegador no permite guardarlo.');}));document.querySelectorAll('[data-calc]').forEach(x=>x.addEventListener('input',calc));if(document.getElementById('calc-price'))calc();document.querySelector('[data-action="copy-route"]').addEventListener('click',()=>copyText(location.hash+'\nAbre esta ruta al final de la dirección del HTML compartido. Si está alojado, usa la URL completa: '+location.href));document.querySelector('[data-action="print-profile"]').addEventListener('click',()=>printProfile(p));}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('Texto copiado. Revisa los datos antes de usarlo.');}catch{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.left='-9999px';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();toast(ok?'Texto copiado.':'No se pudo copiar automáticamente. Selecciona el texto y usa Copiar.');}}
function copyElement(id){const el=document.getElementById(id);if(el)copyText('value' in el?el.value:el.innerText);}
function printProfile(p){const content=document.getElementById('tab-content');const tab=activeTab;const restore=()=>{drawProfile(p,tab);window.removeEventListener('afterprint',restore);};content.innerHTML=renderEnfoque(p)+renderPlan(p)+renderContenido(p)+renderCaptacion(p)+renderAgenda(p)+renderFuentes(p);if(p.calculator)calc();window.addEventListener('afterprint',restore,{once:true});window.print();}
function route(){const raw=location.hash.replace(/^#/,'');if(!raw||raw==='inicio'){drawHome();return;}const [id,t]=raw.split('/');const p=DATA.profiles.find(x=>x.id===id);if(!p){drawHome();toast('Ese perfil no existe. Selecciona un participante.');return;}drawProfile(p,tabs.some(x=>x[0]===t)?t:'enfoque');}
window.addEventListener('hashchange',()=>{route();window.scrollTo({top:0,behavior:'instant'});});route();
</script>
</body>
